networks:
  pulp:
    name: "pulp"

volumes:
  pulp-__PLUGIN__-claude-config:
  pulp-__PLUGIN__-postgres-data:
  pulp-__PLUGIN__-pulp-media:

services:
  pulp-__PLUGIN__:
    image: localhost/devcontainer-pulp-__PLUGIN__:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      PULP_DATABASES__default__HOST: pulp-__PLUGIN__-db
      PULP_DATABASES__default__PASSWORD: pulp
      PULP_REDIS_URL: redis://pulp-__PLUGIN__-redis:6379/0
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ${PULP___PLUGIN_UPPER___PATH:-~/git/pulp/pulp___PLUGIN__}:/workspace:cached
      - ${PULPCORE_PATH:-~/git/pulp/pulpcore}:/repositories/pulpcore:cached
      - ./postCreateCommand.sh:/tmp/postCreateCommand.sh:Z
      - ./prepare-bindings.sh:/tmp/prepare-bindings.sh:Z
      - ./patches:/tmp/patches:ro,Z
      - pulp-__PLUGIN__-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
      - pulp-__PLUGIN__-pulp-media:/var/lib/pulp
      - ./skills:/tmp/claude-skills:ro,Z
    networks:
      - pulp
    depends_on:
      pulp-__PLUGIN__-db:
        condition: service_healthy
      pulp-__PLUGIN__-redis:
        condition: service_started

  pulp-__PLUGIN__-db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pulp-__PLUGIN__-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: pulp
      POSTGRES_DB: pulp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulp -d pulp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulp

  pulp-__PLUGIN__-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - pulp
