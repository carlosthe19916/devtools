networks:
  pulp-ui:
    name: "pulp-ui"

volumes:
  pulp-ui-claude-config:
  pulp-ui-certs:
  pulp-storage:
  pulp-pgsql:
  pulp-containers:

services:
  pulp-ui:
    image: localhost/devcontainer-pulp-ui:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    environment:
      API_PROXY: http://pulp:80
      GH_TOKEN: ${GH_TOKEN}
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ${PULP_UI_PATH:-~/git/pulp/pulp-ui}:/workspace:cached
      - ./postCreateCommand.sh:/tmp/postCreateCommand.sh:Z
      - pulp-ui-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
    ports:
      - "8002:8002"
    networks:
      - pulp-ui
    depends_on:
      - pulp

  pulp:
    image: docker.io/pulp/pulp:latest
    container_name: pulp-ui-backend
    environment:
      # Sets admin password on first boot when the admin user does not yet exist.
      PULP_DEFAULT_ADMIN_PASSWORD: admin
    ports:
      - "8088:80"
    volumes:
      - ./pulp/settings/settings.py:/etc/pulp/settings.py:Z
      - pulp-ui-certs:/etc/pulp/certs:Z
      - pulp-storage:/var/lib/pulp:Z
      - pulp-pgsql:/var/lib/pgsql:Z
      - pulp-containers:/var/lib/containers:Z
    networks:
      - pulp-ui
