networks:
  pulp:
    name: "pulp"

volumes:
  pulp-maven-claude-config:
  pulp-maven-postgres-data:

services:
  pulp-maven:
    image: localhost/devcontainer-pulp-maven:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      PULP_DATABASES__default__HOST: pulp-maven-db
      PULP_DATABASES__default__PASSWORD: pulp
      PULP_REDIS_URL: redis://pulp-maven-redis:6379/0
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ${PULP_MAVEN_PATH:-~/git/pulp/pulp_maven}:/workspace:cached
      - ${PULPCORE_PATH:-~/git/pulp/pulpcore}:/repositories/pulpcore:cached
      - ./postCreateCommand.sh:/tmp/postCreateCommand.sh:Z
      - pulp-maven-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
    networks:
      - pulp
    depends_on:
      pulp-maven-db:
        condition: service_healthy
      pulp-maven-redis:
        condition: service_started

  pulp-maven-db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pulp-maven-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: pulp
      POSTGRES_DB: pulp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulp -d pulp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulp

  pulp-maven-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - pulp
