networks:
  pulp-ui-2:
    name: "pulp-ui-2"

volumes:
  pulp-containers:
  pulp-pgsql:
  pulp-storage:
  pulp-ui-2-certs:
  pulp-ui-2-claude-config:

services:
  pulp-ui-2:
    image: localhost/devcontainer-pulp-ui-2:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    environment:
      # --- Application ---
      # In-compose DNS → service "pulp" (not localhost; host maps that as :8089).
      DEVCONTAINER_API_URL: http://pulp
      # --- AI tooling ---
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GH_TOKEN: ${GH_TOKEN}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      # --- Workspace ---
      - ${PULP_UI_2_PATH:-~/git/pulp/pulp-ui-2}:/workspace:cached
      # --- Init scripts ---
      - ./postCreateCommand.sh:/tmp/postCreateCommand.sh:Z
      # --- User and AI config ---
      - pulp-ui-2-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
    ports:
      - "3000:3000"
    networks:
      - pulp-ui-2
    depends_on:
      - pulp

  pulp:
    image: docker.io/pulp/pulp:latest
    container_name: pulp-ui-2-backend
    environment:
      # Sets admin password on first boot when the admin user does not yet exist.
      PULP_DEFAULT_ADMIN_PASSWORD: password
    ports:
      - "8089:80"
    volumes:
      - ./pulp/settings/settings.py:/etc/pulp/settings.py:Z
      - pulp-ui-2-certs:/etc/pulp/certs:Z
      - pulp-storage:/var/lib/pulp:Z
      - pulp-pgsql:/var/lib/pgsql:Z
      - pulp-containers:/var/lib/containers:Z
    networks:
      - pulp-ui-2
