networks:
  pulp-service:
    name: "pulp-service"

volumes:
  pulp-service-claude-config:
  pulp-service-grafana-data:
  pulp-service-postgres-data:
  pulp-service-prometheus-data:
  pulp-service-pulp-media:

services:
  pulp-service:
    image: localhost/devcontainer-pulp-service:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    env_file:
      - ./pulp-dev.env
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/uv.env
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/devcontainer.env
    environment:
      # --- Pulp runtime ---
      API_HOST: localhost
      API_PORT: "80"
      API_PROTOCOL: http
      DB_HOST: pulp-service-db
      DB_PASSWORD: pulp
      PULP_SETTINGS: /etc/pulp/settings.py
      # Prevent cwd (/workspace) from shadowing the editable pulp_service package.
      PYTHONSAFEPATH: "1"
      REDIS_URL: redis://pulp-service-redis:6379/0
      # --- Devcontainer config ---
      DEVCONTAINER_BINDINGS: core python npm rpm maven file service container
      DEVCONTAINER_BINDINGS_DOMAIN_ENABLED: "true"
      DEVCONTAINER_DEV_KIND: service
      DEVCONTAINER_PATCH_DIR: /workspace/images/assets/patches
      DEVCONTAINER_PATCH_STRICT: "1"
      DEVCONTAINER_POPULATE_DOMAIN: my-public-domain
      DEVCONTAINER_POPULATE_MODE: service
      DEVCONTAINER_POPULATE_TYPES: file,pypi,maven,npm,rpm
      DEVCONTAINER_REQUIREMENTS: /workspace/pulp_service/requirements.txt
      DEVCONTAINER_SHELL_MARKER: "# pulp-service devcontainer helpers"
      # --- External services ---
      # OTLP → pulp-service-otel (localhost:4318 would miss the sibling collector).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pulp-service-otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # --- AI tooling ---
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GH_TOKEN: ${GH_TOKEN}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      # --- Workspace ---
      - ${PULP_SERVICE_PATH:-~/git/pulp/pulp-service}:/workspace:cached
      # --- Source repositories ---
      - ${PULPCORE_PATH:-~/git/pulp/pulpcore}:/repositories/pulpcore:cached
      - ${PULP_MAVEN_PATH:-~/git/pulp/pulp_maven}:/repositories/pulp_maven:cached
      - ${PULP_PYTHON_PATH:-~/git/pulp/pulp_python}:/repositories/pulp_python:cached
      # --- Devtools (pulp-dev-common) ---
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/config:/opt/pulp-dev/config:ro,Z
      - ./config/nginx.conf:/opt/pulp-dev/config/nginx.conf:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/populate:/opt/pulp-dev/populate:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/scripts:/opt/pulp-dev/scripts:ro,Z
      - ./scripts/setup/20-python-deps.sh:/opt/pulp-dev/scripts/setup/20-python-deps.sh:ro,Z
      - ./scripts/setup/30-keys-and-patches.sh:/opt/pulp-dev/scripts/setup/30-patches.sh:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/skills:/opt/pulp-dev/skills:ro,Z
      - ./skills/pulp-profile:/opt/pulp-dev/skills/pulp-profile:ro,Z
      # --- Application data ---
      - ./config/certs/pulp-services-non-prod.pem:/etc/pulp/certs/pulp-services-non-prod.pem:ro,Z
      - pulp-service-pulp-media:/var/lib/pulp
      # --- User and AI config ---
      - pulp-service-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
    networks:
      - pulp-service
    depends_on:
      pulp-service-db:
        condition: service_healthy
      pulp-service-redis:
        condition: service_started
      pulp-service-otel:
        condition: service_started

  pulp-service-db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pulp-service-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: pulp
      POSTGRES_DB: pulp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulp -d pulp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulp-service

  pulp-service-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - pulp-service

  pulp-service-otel:
    # contrib includes the prometheus exporter (core does not).
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro,Z
    networks:
      - pulp-service
    restart: unless-stopped

  pulp-service-prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - pulp-service-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - pulp-service
    depends_on:
      - pulp-service-otel
    restart: unless-stopped

  pulp-service-grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - pulp-service-grafana-data:/var/lib/grafana
    ports:
      - "3200:3000"
    networks:
      - pulp-service
    depends_on:
      - pulp-service-prometheus
    restart: unless-stopped
