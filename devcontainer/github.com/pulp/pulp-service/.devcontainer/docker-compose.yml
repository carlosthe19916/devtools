networks:
  pulp-service:
    name: "pulp-service"

volumes:
  pulp-service-claude-config:
  pulp-service-postgres-data:
  pulp-service-pulp-media:

services:
  pulp-service:
    image: localhost/devcontainer-pulp-service:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    env_file:
      - ./pulp-dev.env
    environment:
      GH_TOKEN: ${GH_TOKEN}
      PULP_SETTINGS: /etc/pulp/settings.py
      DB_HOST: pulp-service-db
      DB_PASSWORD: pulp
      REDIS_URL: redis://pulp-service-redis:6379/0
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: "80"
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
      # Prevent cwd (/workspace) from shadowing the editable pulp_service package.
      PYTHONSAFEPATH: "1"
      PULP_PATCH_DIR: /workspace/images/assets/patches
      PULP_DEV_SCRIPTS: /opt/pulp-dev/scripts
      PULP_DEV_CONFIG: /opt/pulp-dev/config
      PULP_DEV_SKILLS: /opt/pulp-dev/skills
      PULP_POPULATE_ROOT: /opt/pulp-dev/populate
      PULP_DEV_KIND: service
      PULP_BINDINGS: core python npm rpm maven file service container
      PULP_PATCH_STRICT: "1"
      PULP_NGINX_REMOUNT: "1"
      PULP_SHELL_MARKER: "# pulp-service devcontainer helpers"
      PULP_BINDINGS_DOMAIN_ENABLED: "true"
      PULP_REQUIREMENTS: /workspace/pulp_service/requirements.txt
      PULP_POPULATE_MODE: service
      PULP_POPULATE_TYPES: file,pypi,maven,npm,rpm
      PULP_POPULATE_DOMAIN: my-public-domain
      # Direct pulpcore-api (not nginx :80) — avoids 502 while API is down.
      PULP_POPULATE_BASE_URL: http://localhost:24817
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ${PULP_SERVICE_PATH:-~/git/pulp/pulp-service}:/workspace:cached
      - ${PULPCORE_PATH:-~/git/pulp/pulpcore}:/repositories/pulpcore:cached
      - ${PULP_MAVEN_PATH:-~/git/pulp/pulp_maven}:/repositories/pulp_maven:cached
      - ${PULP_PYTHON_PATH:-~/git/pulp/pulp_python}:/repositories/pulp_python:cached
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/scripts:/opt/pulp-dev/scripts:ro,Z
      - ./scripts/setup/20-python-deps.sh:/opt/pulp-dev/scripts/setup/20-python-deps.sh:ro,Z
      - ./scripts/setup/30-keys-and-patches.sh:/opt/pulp-dev/scripts/setup/30-patches.sh:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/config:/opt/pulp-dev/config:ro,Z
      - ./config/nginx.conf:/opt/pulp-dev/config/nginx.conf:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/skills:/opt/pulp-dev/skills:ro,Z
      - ${DEVTOOLS_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/populate:/opt/pulp-dev/populate:ro,Z
      - pulp-service-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
      - pulp-service-pulp-media:/var/lib/pulp
      - ./config/certs/pulp-services-non-prod.pem:/etc/pulp/certs/pulp-services-non-prod.pem:ro,Z
    networks:
      - pulp-service
    depends_on:
      pulp-service-db:
        condition: service_healthy
      pulp-service-redis:
        condition: service_started

  pulp-service-db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pulp-service-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: pulp
      POSTGRES_DB: pulp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulp -d pulp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulp-service

  pulp-service-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - pulp-service
