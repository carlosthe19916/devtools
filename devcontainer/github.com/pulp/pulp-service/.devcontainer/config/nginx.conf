worker_processes 1;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    types_hash_max_size 4096;
    access_log /var/log/nginx/access.log;

    upstream pulp-content {
        server 127.0.0.1:24816;
    }

    upstream pulp-api {
        server 127.0.0.1:24817;
    }

    upstream swagger-ui {
        server swagger-ui:8080;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 10m;
        keepalive_timeout 5;

        # Content app (ClowdApp PULP_CONTENT_PATH_PREFIX)
        location /api/pulp-content/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-content;
        }

        # API (ClowdApp PULP_API_ROOT)
        location /api/pulp/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
            client_max_body_size 0;
        }

        # Swagger UI (same-origin; OpenAPI via relative /api/pulp/...)
        location /swagger/ {
            proxy_pass http://swagger-ui/;
        }

        # Container registry v2
        location /api/pulp/v2/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
        }

        location /api/pypi/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
        }

        # Legacy oci-env paths
        location /pulp/content/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-content;
        }

        location /pulp/api/v3/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
            client_max_body_size 0;
        }

        location /pulp/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
        }

        location /auth/login/ {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
        }

        include /etc/nginx/pulp/*.conf;

        location / {
            include /etc/nginx/pulp-proxy-params.conf;
            proxy_pass http://pulp-api;
        }
    }
}
