networks:
  pulpcore:
    name: "pulpcore"

volumes:
  pulpcore-claude-config:
  pulpcore-postgres-data:
  pulpcore-pulp-media:

services:
  pulpcore:
    image: localhost/devcontainer-pulpcore:latest
    build:
      context: ${DEVTOOLS_CARLOSTHE19916_PATH:-~/git/devtools}/devcontainer/github.com/pulp
      dockerfile: pulp-dev-common/Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    env_file:
      - ./pulp-dev.env
    environment:
      GH_TOKEN: ${GH_TOKEN}
      PULP_SETTINGS: /etc/pulp/settings.py
      DB_HOST: pulpcore-db
      DB_PASSWORD: pulp
      REDIS_URL: redis://pulpcore-redis:6379/0
      API_PROTOCOL: http
      API_HOST: localhost
      # Bindings/CLI default host port (API). Content uses nginx :80 via CONTENT_ORIGIN.
      API_PORT: "24817"
      PYTHONSAFEPATH: "1"
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
      PULP_PATCH_DIR: /opt/pulp-dev/patches
      PULP_DEV_SCRIPTS: /opt/pulp-dev/scripts
      PULP_DEV_CONFIG: /opt/pulp-dev/config
      PULP_DEV_SKILLS: /opt/pulp-dev/skills
      PULP_POPULATE_ROOT: /opt/pulp-dev/populate
      PULP_DEV_KIND: core
      PULP_PATCH_TREE: /workspace
      PULP_PYPROJECT: /workspace/pyproject.toml
      PULP_NGINX_REMOUNT: "1"
      PULP_SHELL_MARKER: "# pulpcore devcontainer helpers"
      PULP_BINDINGS_DOMAIN_ENABLED: "false"
      PULP_POPULATE_MODE: plugin
      PULP_POPULATE_TYPES: file
      PULP_POPULATE_BASE_URL: http://localhost:24817
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ${PULPCORE_PATH:-~/git/pulp/pulpcore}:/workspace:cached
      - ${PULP_MAVEN_PATH:-~/git/pulp/pulp_maven}:/repositories/pulp_maven:cached
      - ${PULP_PYTHON_PATH:-~/git/pulp/pulp_python}:/repositories/pulp_python:cached
      - ${DEVTOOLS_CARLOSTHE19916_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/scripts:/opt/pulp-dev/scripts:ro,Z
      - ./scripts/setup/20-python-deps.sh:/opt/pulp-dev/scripts/setup/20-python-deps.sh:ro,Z
      - ${DEVTOOLS_CARLOSTHE19916_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/config:/opt/pulp-dev/config:ro,Z
      - ./config/smash.json:/opt/pulp-dev/config/smash.json:ro,Z
      - ${DEVTOOLS_CARLOSTHE19916_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/skills:/opt/pulp-dev/skills:ro,Z
      - ./skills/pulp-profile:/opt/pulp-dev/skills/pulp-profile:ro,Z
      - ${DEVTOOLS_CARLOSTHE19916_PATH:-~/git/devtools}/devcontainer/github.com/pulp/pulp-dev-common/populate:/opt/pulp-dev/populate:ro,Z
      - ./patches:/opt/pulp-dev/patches:ro,Z
      - pulpcore-claude-config:/home/vscode/.claude
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:cached
      - pulpcore-pulp-media:/var/lib/pulp
    networks:
      - pulpcore
    depends_on:
      pulpcore-db:
        condition: service_healthy
      pulpcore-redis:
        condition: service_started

  pulpcore-db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pulpcore-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: pulp
      POSTGRES_DB: pulp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulp -d pulp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulpcore

  pulpcore-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - pulpcore
