networks:
  pulp:
    name: "pulp"
  pulp-trustify:
    name: "pulp-trustify"

volumes:
  pulp-ui-claude-config:
  pulp-ui-cursor-config:

services:
  pulp-ui:
    image: localhost/devcontainer-pulp-ui:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    environment:
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN}
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      # --- Workspace ---
      - ${UI_PACKAGES_REDHAT_COM_PATH:-~/git/pulp/ui-packages.redhat.com}:/workspace:cached
      # --- Init scripts ---
      - ./postCreateCommand.sh:/tmp/postCreateCommand.sh:Z
      # --- User and AI config ---
      - pulp-ui-claude-config:/home/vscode/.claude
      - pulp-ui-cursor-config:/home/vscode/.cursor
      - ${HOME}/.config/gcloud:/home/vscode/.config/gcloud:cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro,Z
      - ${HOME}/.gitconfig-gitlab:/home/vscode/.gitconfig-gitlab:ro,Z
      - ${HOME}/.ssh:/home/vscode/.ssh:ro,cached
      - ${HOME}/.vite-plugin-mkcert:/home/vscode/.vite-plugin-mkcert:cached
    networks:
      - pulp
      - pulp-trustify
